schema_version: 1

context:
  version: "3.3.2"

package:
  name: wtforms
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/w/wtforms/wtforms-${{ version }}.tar.gz
  sha256: 49bb51d10b7832d497e758736da4d56f7d129a015db24756f36f28992f175404

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-build-isolation --no-deps -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - babel >=2.8.0
    - setuptools
  run:
    - python >=${{ python_min }}
    - markupsafe >=1.1.1

tests:
  - python:
      imports:
        - wtforms
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license: BSD-3-Clause
  license_file: LICENSE.rst
  summary: A flexible forms validation and rendering library for Python
  homepage: https://github.com/wtforms/wtforms/
  repository: https://github.com/wtforms/wtforms
  documentation: http://wtforms.readthedocs.io

extra:
  recipe-maintainers:
    - mcs07
    - synapticarbors
    - thewchan
